# PR 자동 검증 (무료 정적분석) — 린트 + 단위 테스트 + 빌드/타입체크.
# AI 코드리뷰는 작성자(Claude)가 절차 5단계(/code-review)에서 세션 내에서 수행한다.
# 이 CI는 자동 게이트: 테스트·타입·빌드 오류를 머지 전에 잡는다.
name: CI

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths-ignore:
      - "**/*.md"
      - "**/*.lock"
      - "pnpm-lock.yaml"
      - "client/prisma/generated/**"

permissions:
  contents: read

jobs:
  static-analysis:
    runs-on: ubuntu-latest
    # 포크 PR은 스킵(보안)
    if: github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: client
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # 테스트 필수 게이트가 base 브랜치와 diff 를 떠야 한다.
          # 얕은 클론이면 base ref 가 없어 게이트가 조용히 통과된다.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: client/pnpm-lock.yaml

      - name: Install (client)
        run: pnpm install --frozen-lockfile

      # 기존 위반은 client/eslint-suppressions.json 에 기준선으로 고정돼 있다.
      # 여기서 막는 것은 "새로 들어오는" 위반이다. 기준선을 줄이려면 pnpm lint:prune.
      - name: Lint
        run: pnpm lint

      - name: Test (순수 함수 단위 테스트)
        run: pnpm test

      - name: 순수 모듈 테스트 필수 게이트
        run: pnpm test:required "origin/${{ github.event.pull_request.base.ref }}"

      - name: Build + typecheck
        run: pnpm build
