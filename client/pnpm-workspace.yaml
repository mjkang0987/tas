# 갓 배포된 패키지 설치 차단(공급망 보안). Cloud Build(pnpm 11)가 강제하는 24h(1440분)
# 정책을 로컬에도 명시 — pnpm update가 신규 패키지를 lockfile에 넣어 배포가 깨지는 재발 방지(#87).
minimumReleaseAge: 1440
allowBuilds:
  '@prisma/engines': true
  prisma: true
  sharp: true
  unrs-resolver: true
# pnpm 11+ 설정 위치 (package.json의 pnpm 필드는 더 이상 읽지 않음)
# 보안 패치용 override 모음 — 88eaaf9(의존성 취약점 정리)에서 이전.
overrides:
  # ReDoS(CVE-2025-5889) 패치. 단일 버전(5.0.6) 강제는 1.x API(module.exports=함수)를
  # 기대하는 minimatch@3.x 를 깨뜨리므로(=expand is not a function) 1.x 만 패치본으로 핀.
  # minimatch@10.x 는 brace-expansion@^5.0.2 → 5.0.6(패치본) 으로 자연 해석되어 override 불필요.
  # 1.x 는 패치본이 계속 나온다 — 고정 핀이 아니라 하한으로 두어 다음 패치를 자동으로 받는다
  # (1.1.12 에 박아두는 바람에 DoS 3건이 그대로 남아 있었다: GHSA 무한확장·무한길이·중간배열).
  'brace-expansion@1': '>=1.1.18 <2'
  # 8.5.13 고정 핀이 경로탐색(previous source map 자동로딩) 패치를 막고 있었다.
  postcss: '>=8.5.23 <9'
  react: 19.2.7
  react-dom: 19.2.7
  '@hono/node-server': '>=1.19.13' # prisma dev 도구 경유
  # 재귀 객체 병합 시 스택 고갈. prisma@7.9.1 이 아직 <8 을 물고 있어 메이저를 강제한다
  # (prisma config 파싱 경로 — 빌드/generate 로 확인).
  deepmerge-ts: '>=8'
  # 아래 셋은 개발 도구 경유(eslint·prisma CLI) 전이 의존. 상위가 아직 취약본을 물고 있어
  # 하한만 올린다 — 배포물에는 들어가지 않는다.
  'brace-expansion@5': '>=5.0.9'
  js-yaml: '>=4.3.1 <5'
  fast-uri: '>=3.1.5 <4'
  # eslint 도구 경유 sourceMappingURL 파일읽기 패치. 상한 <8로 막아
  # 갓 배포된 babel 8 메이저(minimumReleaseAge 위반)로 점프하지 않게 함.
  '@babel/core': '>=7.29.6 <8'
